<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ネミル｜価格比較・最安値・買い時が分かる</title>
<meta name="description"
      content="ネミルは、商品の価格をみんなで投稿・共有する価格比較サービスです。最安値・平均価格・買い時がひと目で分かり、スーパーやドラッグストアでのお買い物をもっとお得にします。">

<meta name="robots" content="index,follow">
<meta name="author" content="ネミル">
<meta name="application-name" content="ネミル">
<!-- アイコン -->
<link rel="icon" href="assets/logo/favicon.png">
<link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#059669">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
    <div class="header-inner">
        <h1 class="logo">
            <span class="logo-icon">🛒</span>
            ネミル
        </h1>
        <p class="tagline">みんなで作る底値・買い時データベース</p>
        <button id="settingsButton" class="icon-button" aria-label="設定">
          <span class="material-icons">settings</span>
        </button>
    </div>
</header>

<main class="container">

    <section class="card search-card">
        <div class="search-category-group">
            <label class="search-label" for="searchCategory">カテゴリー</label>
            <select id="searchCategory">
                <option value="">すべて</option>
            </select>
        </div>
        <label class="search-label search-label-spaced" for="productName">商品名・キーワード検索</label>
        <div class="search-row">
            <div class="input-wrap">
                <input id="productName" type="text" placeholder="商品名やキーワードを入力してください" autocomplete="off">
            </div>
            <div class="search-row-actions">
                <button class="btn btn-primary" type="button" onclick="searchProduct()">検索</button>
                <button class="btn btn-secondary" type="button" onclick="clearSearch()">クリア</button>
            </div>
        </div>
    </section>

    <section id="result" class="card">
        <div class="card-header">
            <span class="card-icon">📊</span>
            <h2>検索結果</h2>
        </div>
        <div class="empty-state">
            <div class="empty-state-icon">🔍</div>
            <p>商品名を入力して検索してください</p>
        </div>
    </section>

    <section id="ranking" class="card">
        <div class="card-header">
            <span class="card-icon">🏪</span>
            <h2>店舗ランキング</h2>
        </div>
        <div class="empty-state">
            <div class="empty-state-icon">📋</div>
            <p>商品を検索すると店舗別の最安値が表示されます</p>
        </div>
    </section>

    <h2 class="section-heading">みんなの価格投稿</h2>
    <div id="price-list" class="card">
        <div class="empty-state">
            <div class="empty-state-icon">💬</div>
            <p>まだ投稿がありません</p>
        </div>
    </div>

    <section class="card">
        <div class="card-header">
            <span class="card-icon">✏️</span>
            <h2>価格を投稿</h2>
        </div>

        <div class="field-group">
            <label class="field-label" for="newProduct">商品名</label>
            <div class="product-row">
                <div class="input-wrap" style="flex:1">
                    <input id="newProduct" type="text" placeholder="例：アタック抗菌EX" autocomplete="off">
                    <div id="newSuggestions" class="suggestions"></div>
                </div>
                <button class="btn btn-icon" disabled title="近日対応予定">📷</button>
                <input type="file" id="barcodeFile" accept="image/*" capture="environment" style="display:none">
            </div>
        </div>

        <div class="field-group">
            <label class="field-label" for="newStore">店舗名</label>
            <div class="input-wrap">
                <input id="newStore" type="text" placeholder="例：コスモス" autocomplete="off">
                <div id="storeSuggestions" class="suggestions"></div>
            </div>
        </div>

        <div class="field-group">
            <label class="field-label" for="newPrice">価格（円）</label>
            <input id="newPrice" type="number" placeholder="298" min="0">
        </div>

        <div class="post-buttons">
            <button class="btn btn-secondary" type="button" onclick="clearPostForm()">クリア</button>
            <button class="btn btn-primary" type="button" onclick="addPrice()">投稿する</button>
        </div>
    </section>

</main>

<nav class="bottom-nav" aria-label="主要メニュー">
    <a class="bottom-nav-item is-active" href="index.html" aria-current="page"><span class="bottom-nav-icon" aria-hidden="true">🏷️</span><span>価格比較</span></a>
    <a class="bottom-nav-item" href="unit-price.html"><span class="bottom-nav-icon" aria-hidden="true">🧮</span><span>単価計算</span></a>
    <a class="bottom-nav-item" href="settings.html"><span class="bottom-nav-icon" aria-hidden="true">⚙️</span><span>設定</span></a>
</nav>

<div id="scanner"></div>
<button id="closeScanner">✕</button>

<div id="regionModal" class="region-modal">

    <div class="region-card">

        <h2>地域を設定してください</h2>

        <div id="cityList"></div>

        <button id="saveRegionBtn" type="button">

            決定

        </button>

    </div>

</div>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@zxing/browser@latest"></script>
<script src="region-settings.js"></script>
<script src="app.js"></script>
</body>
</html>
